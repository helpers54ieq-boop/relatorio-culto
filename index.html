<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de Culto</title>
<meta name="theme-color" content="#0d1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relatório">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#f2f4f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#16202f}
  body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);box-sizing:border-box}
  #app{position:fixed;inset:env(safe-area-inset-top,0) 0 0 0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;display:block;background:#f2f4f8}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#ffffff;transition:opacity .3s}
  .splash img{width:140px;height:140px}
  .splash p{margin:0;color:#5b6678;font-size:15px}
  .splash.hide{opacity:0;pointer-events:none}
  .off{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#fff}
  .off h1{font-size:20px;margin:0}
  .off p{margin:0;color:#5b6678;max-width:320px;line-height:1.5}
  .off button{font:inherit;font-weight:700;font-size:17px;padding:14px 22px;border:0;border-radius:8px;background:#1d3f8f;color:#fff}
  [hidden]{display:none!important}
</style>
</head>
<body>
<iframe id="app" title="Relatório de Culto" allow="clipboard-write"></iframe>

<div class="splash" id="splash">
  <img src="icon-512.png" alt="54 IEQ">
  <p>Carregando o relatório…</p>
</div>

<div class="off" id="off" hidden>
  <img src="icon-192.png" alt="" width="96" height="96">
  <h1>Sem internet</h1>
  <p>O relatório precisa de internet para abrir e para salvar. Confira o Wi‑Fi ou os dados móveis e tente de novo.</p>
  <button type="button" id="retry">Tentar de novo</button>
</div>

<script>
  // Endereço do formulário (o mesmo link do Apps Script)
  const APP_URL = "https://script.google.com/macros/s/AKfycbzi3aAR-TGY4xrxinZvxhxpWV5EIR3FBnEu9LpfIC1iJ-VUf0Vm9wQrsYZ_TyOi9hyB4A/exec";

  const frame = document.getElementById("app");
  const splash = document.getElementById("splash");
  const off = document.getElementById("off");

  function abrir(){
    if (!navigator.onLine){ off.hidden = false; splash.classList.add("hide"); return; }
    off.hidden = true; splash.classList.remove("hide");
    frame.src = APP_URL;
  }
  frame.addEventListener("load", () => { if (frame.src) splash.classList.add("hide"); });
  document.getElementById("retry").addEventListener("click", abrir);
  window.addEventListener("online", () => { if (!off.hidden) abrir(); });
  abrir();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
